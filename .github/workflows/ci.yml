name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
permissions:
   contents: read
  
jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test src/backend/repositories/anomaly-repository.test.js
